<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Be My Valentine? 💌</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts: Gochi Hand for the cute handwriting, Outfit for clean text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgPink: '#FCF0F2',
            textRed: '#B61F1F',
            subText: '#877B7B',
          },
          fontFamily: {
            hand: ['"Gochi Hand"', 'cursive'],
            sans: ['"Outfit"', 'sans-serif']
          },
          animation: {
            'fade-in': 'fadeIn 1s ease-out forwards',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FDF1F3; /* Very soft pink background */
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* 
      This is a placeholder for the beautiful watercolor balloons. 
      You can replace the background-image URL with your actual asset!
    */
    .bg-illustration {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&q=80&w=800');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.6; /* Softened so the card pops */
      z-index: 0;
      mix-blend-mode: multiply;
    }

    /* The frosted glass effect from your reference */
    .glass-card {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 30px 60px rgba(182, 31, 31, 0.08);
      border-radius: 2rem;
    }

    /* Button Styles */
    .yes-btn-gradient {
      background: linear-gradient(135deg, #b21e1e, #dc3636);
      transition: all 0.3s ease;
      transform-origin: center left;
    }
    
    .yes-btn-gradient:hover {
      box-shadow: 0 10px 25px rgba(178, 30, 30, 0.4);
    }

    .no-btn-glass {
      background: rgba(230, 230, 230, 0.3);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(150, 150, 150, 0.2);
      transition: all 0.3s ease;
    }

    .no-btn-glass:hover {
      background: rgba(230, 230, 230, 0.5);
    }
  </style>
</head>

<body class="selection:bg-textRed selection:text-white font-sans antialiased text-gray-800 relative">

  <!-- Background Illustration -->
  <div class="bg-illustration animate-float"></div>

  <!-- Main Card Container -->
  <main class="relative z-10 w-[90%] max-w-md aspect-square max-h-[500px] glass-card flex flex-col items-center justify-center p-8 sm:p-10 animate-fade-in text-center">
    
    <!-- PROPOSAL CONTENT -->
    <div id="proposal-box" class="w-full flex flex-col items-center justify-center h-full transition-opacity duration-500">
      
      <p class="font-hand text-2xl sm:text-3xl text-textRed mb-1 tracking-wide">
        Hey!!
      </p>

      <h1 class="font-hand text-4xl sm:text-5xl lg:text-6xl text-textRed leading-tight mb-4 drop-shadow-sm">
        Will you be <br>my Valentine?
      </h1>

      <p id="prompt-subtitle" class="font-sans text-subText text-xs sm:text-sm font-light mb-8 max-w-[200px]">
        Saying no is strictly not an option...
      </p>

      <!-- Action Buttons -->
      <div id="button-stage" class="relative flex flex-row items-center justify-center gap-4 w-full">
        
        <button 
          id="btn-yes" 
          onclick="handleYesClick()"
          class="yes-btn-gradient relative z-20 px-6 py-2.5 sm:px-8 sm:py-3 rounded-full text-white font-sans text-sm sm:text-base font-medium tracking-wide shadow-lg shadow-red-500/30 cursor-pointer flex-shrink-0"
        >
          <span>Yes, Forever!</span>
        </button>

        <button 
          id="btn-no" 
          class="no-btn-glass relative z-10 px-6 py-2.5 sm:px-8 sm:py-3 rounded-full text-subText font-sans text-sm sm:text-base font-medium cursor-pointer flex-shrink-0"
        >
          No
        </button>
      </div>
      
    </div>

    <!-- SUCCESS CONTENT (Hidden by default) -->
    <div id="success-box" class="hidden absolute inset-0 w-full h-full flex flex-col items-center justify-center p-8 text-center transition-opacity duration-500 opacity-0">
      <div class="text-5xl mb-4 animate-bounce">❤️</div>
      
      <h2 class="font-hand text-4xl sm:text-5xl text-textRed mb-4 leading-tight">
        YAY! <br>It's official!
      </h2>
      
      <p class="text-subText text-sm sm:text-base font-sans font-light mb-8 max-w-[250px]">
        Screenshot this and send it to me! I can't wait! 🥰
      </p>

      <button 
        onclick="shareLoveMessage()" 
        class="yes-btn-gradient w-full max-w-[200px] px-6 py-3 rounded-full text-white font-sans text-sm font-medium tracking-wide shadow-lg cursor-pointer"
      >
        Send on WhatsApp 💌
      </button>
    </div>

  </main>

  <script>
    let escapeCount = 0;
    const MAX_ESCAPES = 8;
    let isSuccess = false;

    // We change the text for the NO button, and the YES button physically grows
    const escapeStages = [
      { noText: "Are you sure? 🥺", subtitle: "Think carefully..." },
      { noText: "Really sure? 🧐", subtitle: "Mistakes happen!" },
      { noText: "Pookie please 💔", subtitle: "Cupid is crying..." },
      { noText: "Don't do this! 😍", subtitle: "Look at the YES button!" },
      { noText: "I'm begging 🙈", subtitle: "It's destiny!" }
    ];

    const noBtn = document.getElementById('btn-no');
    const yesBtn = document.getElementById('btn-yes');
    const subtitleEl = document.getElementById('prompt-subtitle');
    const proposalBox = document.getElementById('proposal-box');
    const successBox = document.getElementById('success-box');

    // Simple pop sound
    function playPop() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    function handleNoInteraction(e) {
      if (e) e.preventDefault();
      if (isSuccess || escapeCount >= MAX_ESCAPES) return;

      escapeCount++;
      playPop();

      const stageIndex = Math.min(escapeCount - 1, escapeStages.length - 1);
      const stage = escapeStages[stageIndex];
      
      subtitleEl.textContent = stage.subtitle;
      subtitleEl.classList.add('text-textRed');

      // VIRAL EFFECT: Yes button physically inflates!
      // This increases font size and padding, pushing the No button away
      const baseFontSize = 16;
      const basePaddingY = 12;
      const basePaddingX = 32;
      
      const multiplier = 1 + (escapeCount * 0.4);
      
      yesBtn.style.fontSize = `${baseFontSize * multiplier}px`;
      yesBtn.style.padding = `${basePaddingY * multiplier}px ${basePaddingX * multiplier}px`;
      
      // Keep No button text updating
      noBtn.innerText = stage.noText;
      
      // If they click No too many times, we just hide it!
      if (escapeCount >= MAX_ESCAPES) {
        noBtn.style.opacity = '0';
        noBtn.style.pointerEvents = 'none';
        noBtn.style.position = 'absolute'; // Remove from flex flow to let Yes take over completely
      }
    }

    noBtn.addEventListener('click', handleNoInteraction);

    function fireConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#b21e1e', '#dc3636', '#ffffff'] });
        setTimeout(() => {
          confetti({ particleCount: 100, angle: 60, spread: 80, origin: { x: 0, y: 0.8 }, colors: ['#b21e1e', '#dc3636'] });
          confetti({ particleCount: 100, angle: 120, spread: 80, origin: { x: 1, y: 0.8 }, colors: ['#b21e1e', '#dc3636'] });
        }, 250);
      }
    }

    function handleYesClick() {
      if (isSuccess) return;
      isSuccess = true;
      
      fireConfetti();
      
      proposalBox.style.opacity = '0';
      proposalBox.style.pointerEvents = 'none';
      
      setTimeout(() => {
        proposalBox.classList.add('hidden');
        successBox.classList.remove('hidden');
        // Trigger reflow
        void successBox.offsetWidth;
        successBox.style.opacity = '1';
      }, 500);
    }

    function shareLoveMessage() {
      const text = encodeURIComponent("I said YES! ❤️ Happy Valentine's Day! ✨");
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }
  </script>
</body>
</html>
